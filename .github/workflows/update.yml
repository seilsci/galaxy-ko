name: update-data

on:
  schedule:
    - cron: "23 * * * *"   # 매시 23분 (정각 근처는 GitHub 부하로 밀리거나 건너뛰어져서 피함)
  workflow_dispatch:
  push:
    paths:
      - glossary.json   # 용어집을 고치면 바로 다시 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 데이터 가져오기
        run: python crawl.py
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json translation_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "데이터 갱신"
            git push
          fi
