<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아스팔트 레전드 순위 컷</title>
<meta name="description" content="狂野飙车传奇 Galaxy 클럽 순위 데이터를 한국어로 보여주는 비공식 페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --concrete: #e6e8eb;
    --paper: #ffffff;
    --tarmac: #1d232b;
    --ink: #1a2029;
    --muted: #66707c;
    --line: #d3d7dc;
    --kerb: #d8392b;
    --go: #1d7f49;
    --go-bg: #e1f3e8;
    --done-bg: #eceef1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--concrete);
    color: var(--ink);
    font: 400 15px/1.5 "Noto Sans KR", system-ui, sans-serif;
  }
  .num { font-family: "Barlow Condensed", "Noto Sans KR", sans-serif; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 0 1rem; }

  header.top { background: var(--tarmac); color: #fff; padding: 1rem 0; }
  header.top .wrap { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1.25rem; }
  header.top h1 { margin: 0; font-size: 1.5rem; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; }
  header.top p { margin: 0; color: #b9c1cb; font-size: .9rem; }

  .controls { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; padding: .9rem 0 .2rem; }
  .tabs { display: flex; gap: .4rem; }
  .tabs button, .controls input {
    font: inherit; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 6px; padding: .35rem .85rem; min-height: 40px;
  }
  .tabs button { cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--tarmac); border-color: var(--tarmac); color: #fff; }
  .tabs .count { margin-left: .4rem; opacity: .7; }
  .controls input { flex: 0 1 18rem; min-width: 0; }
  .updated { margin-left: auto; color: var(--muted); font-size: .85rem; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #2b6cdf; outline-offset: 2px; }

  .grid { display: grid; gap: .8rem; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: .7rem 0 1rem; }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 820px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 540px)  { .grid { grid-template-columns: minmax(0, 1fr); } }

  .event { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .event-head { padding: .7rem .85rem .55rem; border-bottom: 1px solid var(--line); }
  .title-row { display: flex; align-items: flex-start; gap: .5rem; }
  .title-row h2 { flex: 1; min-width: 0; margin: 0; font-size: 1rem; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { flex: none; font-size: .72rem; font-weight: 500; padding: .05rem .5rem; border-radius: 999px; }
  .badge.active { background: var(--go-bg); color: var(--go); }
  .badge.finished { background: var(--done-bg); color: var(--muted); }
  .zh { margin: 0; color: var(--muted); font-size: .75rem; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; margin: .3rem 0 0; font-size: .78rem; color: var(--muted); }
  .meta strong { color: var(--ink); font-weight: 700; font-size: 1.05rem; }

  .ladder { list-style: none; margin: 0; padding: .35rem .85rem .6rem; }
  .ladder li { display: grid; grid-template-columns: 4.2rem 1fr 5.5rem; align-items: center; gap: .5rem; padding: .12rem 0; }
  .pct { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .bar { height: 8px; background: var(--done-bg); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--kerb); border-radius: 4px; }
  .rank { text-align: right; font-size: 1.2rem; font-weight: 600; line-height: 1.25; white-space: nowrap; }
  .rank small { font: 400 .75rem "Noto Sans KR", sans-serif; color: var(--muted); margin-left: .1rem; }

  .more { display: block; margin: .2rem auto 1.5rem; font: inherit; padding: .55rem 1.4rem; min-height: 44px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); cursor: pointer; }
  .empty { padding: 2rem 1rem; text-align: center; color: var(--muted); }
  footer { border-top: 1px solid var(--line); padding: .9rem 0; color: var(--muted); font-size: .82rem; text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>아스팔트 레전드 순위 컷</h1>
    <p>상위 몇 %에 들려면 몇 위까지 올라가야 하는지 대회별로 확인하세요. Galaxy 클럽 데이터를 한국어로 옮긴 비공식 페이지입니다.</p>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <div class="tabs" role="group" aria-label="대회 상태">
      <button type="button" data-tab="active" aria-pressed="true">진행 중<span class="count num"></span></button>
      <button type="button" data-tab="finished" aria-pressed="false">지난 대회<span class="count num"></span></button>
    </div>
    <input type="search" id="q" placeholder="대회 이름 검색" aria-label="대회 이름 검색">
    <span class="updated" id="updated"></span>
  </div>
  <main id="list" aria-live="polite"></main>
</div>

<footer>
  <div class="wrap">
    원본: <a href="https://xeyj7va4zfx8.space.minimax.io/" rel="noopener">狂野飙车传奇排行榜 by Galaxy</a>. 번역은 자동이라 원문과 다를 수 있습니다.
  </div>
</footer>

<script>
const STEP = 12;
const state = { tab: "active", q: "", events: [], shown: STEP };
const nf = new Intl.NumberFormat("ko-KR");
const kstFull = iso => new Date(iso).toLocaleString("ko-KR", {
  timeZone: "Asia/Seoul", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false
});
const kstShort = iso => new Date(iso).toLocaleString("ko-KR", {
  timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false
});

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function renderEvent(ev) {
  const card = el("article", "event");
  const head = el("div", "event-head");

  const row = el("div", "title-row");
  const h2 = el("h2", "", ev.name_ko);
  h2.title = ev.name_ko;
  row.append(h2, el("span", "badge " + (ev.status === "active" ? "active" : "finished"),
                    ev.status === "active" ? "진행 중" : "종료"));
  head.append(row);

  if (ev.name_zh && ev.name_zh !== ev.name_ko) {
    const zh = el("p", "zh", ev.name_zh);
    zh.title = ev.name_zh;
    head.append(zh);
  }

  const meta = el("p", "meta");
  const people = el("span", "", "참가자 ");
  people.append(el("strong", "num", nf.format(ev.total || 0)), "명");
  meta.append(people, el("span", "", kstShort(ev.updated_at)));
  head.append(meta);
  card.append(head);

  const ladder = el("ol", "ladder");
  for (const t of ev.tiers) {
    const li = el("li");
    const bar = el("span", "bar");
    const fill = document.createElement("i");
    fill.style.width = Math.min(t.pct, 100) + "%";
    bar.append(fill);
    const rank = el("span", "rank num", nf.format(t.rank));
    rank.append(el("small", "", "위"));
    li.append(el("span", "pct", "상위 " + t.pct + "%"), bar, rank);
    ladder.append(li);
  }
  card.append(ladder);
  return card;
}

function render() {
  const q = state.q.trim().toLowerCase();
  const isActive = e => e.status === "active";
  const matches = e => !q || (e.name_ko + " " + e.name_zh).toLowerCase().includes(q);

  document.querySelectorAll(".tabs button").forEach(b => {
    const tab = b.dataset.tab;
    b.setAttribute("aria-pressed", String(tab === state.tab));
    b.querySelector(".count").textContent =
      state.events.filter(e => (tab === "active") === isActive(e)).length;
  });

  const list = document.getElementById("list");
  list.replaceChildren();
  const all = state.events.filter(e => (state.tab === "active") === isActive(e)).filter(matches);
  if (!all.length) {
    list.append(el("p", "empty", q ? "검색 결과가 없습니다. 다른 이름으로 찾아보세요." : "표시할 대회가 없습니다."));
    return;
  }

  const limit = state.tab === "active" || q ? all.length : state.shown;
  const grid = el("div", "grid");
  all.slice(0, limit).forEach(e => grid.append(renderEvent(e)));
  list.append(grid);

  if (limit < all.length) {
    const more = el("button", "more", "더 보기 (" + (all.length - limit) + "개 남음)");
    more.type = "button";
    more.addEventListener("click", () => { state.shown += STEP; render(); });
    list.append(more);
  }
}

document.querySelectorAll(".tabs button").forEach(b =>
  b.addEventListener("click", () => { state.tab = b.dataset.tab; state.shown = STEP; render(); }));
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; state.shown = STEP; render(); });

fetch("data.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    state.events = data.events;
    document.getElementById("updated").textContent = "데이터 기준 " + kstFull(data.latest_update);
    render();
  })
  .catch(() => {
    document.getElementById("list").replaceChildren(
      el("p", "empty", "데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요."));
  });
</script>
</body>
</html>
