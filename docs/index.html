<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아스팔트 레전드 순위 컷</title>
<meta name="description" content="狂野飙车传奇 Galaxy 클럽 순위 데이터를 한국어로 보여주는 비공식 페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --concrete: #e6e8eb;
    --paper: #ffffff;
    --tarmac: #1d232b;
    --ink: #1a2029;
    --muted: #66707c;
    --line: #d3d7dc;
    --kerb: #d8392b;
    --go: #1d7f49;
    --go-bg: #e1f3e8;
    --done-bg: #eceef1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--concrete);
    color: var(--ink);
    font: 400 15px/1.5 "Noto Sans KR", system-ui, sans-serif;
  }
  .num { font-family: "Barlow Condensed", "Noto Sans KR", sans-serif; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 0 1rem; }

  header.top { background: var(--tarmac); color: #fff; padding: 1rem 0; }
  header.top .wrap { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1.25rem; }
  header.top h1 { flex: 1 0 100%; text-align: center; margin: 0; font-size: 1.5rem; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; }
  header.top p { flex: 1 0 100%; text-align: center; margin: 0; color: #b9c1cb; font-size: .9rem; }

  .controls { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; padding: .9rem 0 .2rem; }
  .tabs { display: flex; gap: .4rem; }
  .tabs button, .controls input {
    font: inherit; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 6px; padding: .35rem .85rem; min-height: 40px;
  }
  .tabs button { cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--tarmac); border-color: var(--tarmac); color: #fff; }
  .tabs .count { margin-left: .4rem; opacity: .7; }
  .controls input { flex: 0 1 18rem; min-width: 0; }
  .updated { margin-left: auto; color: var(--muted); font-size: .85rem; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #2b6cdf; outline-offset: 2px; }

  .grid { display: grid; gap: .8rem; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: .7rem 0 1rem; }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 820px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .event { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .event-head { padding: .7rem .85rem .55rem; border-bottom: 1px solid var(--line); }
  .title-row { display: flex; align-items: flex-start; gap: .5rem; }
  .title-row h2 { flex: 1; min-width: 0; margin: 0; font-size: 1rem; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { flex: none; font-size: .72rem; font-weight: 500; padding: .05rem .5rem; border-radius: 999px; }
  .badge.active { background: var(--go-bg); color: var(--go); }
  .badge.finished { background: var(--done-bg); color: var(--muted); }
  .zh { margin: 0; color: var(--muted); font-size: .75rem; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; margin: .3rem 0 0; font-size: .78rem; color: var(--muted); }
  .meta strong { color: var(--ink); font-weight: 700; font-size: 1.05rem; }

  .ladder { list-style: none; margin: 0; padding: .35rem .85rem .6rem; }
  .ladder li { display: grid; grid-template-columns: 4.2rem 1fr 5.5rem; align-items: center; gap: .5rem; padding: .12rem 0; }
  .pct { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .bar { height: 8px; background: var(--done-bg); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--kerb); border-radius: 4px; }
  .rank { text-align: right; font-size: 1.2rem; font-weight: 600; line-height: 1.25; white-space: nowrap; }
  .rank small { font: 400 .75rem "Noto Sans KR", sans-serif; color: var(--muted); margin-left: .1rem; }

  .more { display: block; margin: .2rem auto 1.5rem; font: inherit; padding: .55rem 1.4rem; min-height: 44px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); cursor: pointer; }
  .empty { padding: 2rem 1rem; text-align: center; color: var(--muted); }
  footer { border-top: 1px solid var(--line); padding: .9rem 0; color: var(--muted); font-size: .82rem; text-align: center; }
  footer a { color: inherit; }

  .trend-row { margin-top: auto; padding: 0 .85rem .75rem; }
  .trend { width: 100%; font: inherit; font-size: .85rem; font-weight: 500; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: .35rem .6rem; min-height: 40px; cursor: pointer; }
  .trend:hover { border-color: var(--tarmac); }

  /* 시간대별 그래프 창 */
  .tm { position: fixed; inset: 0; z-index: 50; background: rgba(20, 25, 32, .55); display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .tm[hidden] { display: none; }
  .tm-box { background: var(--paper); border-radius: 10px; width: min(960px, 100%); max-height: calc(100vh - 2rem); overflow: auto; padding: .8rem 1rem 1rem; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .tm-h { display: flex; align-items: flex-start; gap: .6rem; }
  .tm-h h3 { flex: 1; min-width: 0; margin: 0; font-size: 1.1rem; line-height: 1.35; }
  .tm-h small { display: block; color: var(--muted); font-weight: 400; font-size: .75rem; }
  .tm-x { flex: none; font: inherit; font-size: .85rem; font-weight: 500; color: var(--ink); background: var(--done-bg); border: 1px solid var(--line); border-radius: 999px; padding: .2rem .8rem; min-height: 36px; cursor: pointer; }
  .tm-opts { display: flex; flex-wrap: wrap; gap: .4rem .8rem; align-items: center; margin: .6rem 0 .3rem; }
  .seg { display: flex; gap: .25rem; }
  .seg button { font: inherit; font-size: .78rem; color: var(--muted); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: .1rem .65rem; min-height: 30px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--tarmac); border-color: var(--tarmac); color: #fff; }
  .tm-leg { display: flex; flex-wrap: wrap; gap: .3rem .5rem; margin: .2rem 0 .3rem; }
  .tm-leg button { font: inherit; font-size: .78rem; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: .05rem .6rem .05rem .45rem; min-height: 28px; cursor: pointer; display: inline-flex; align-items: center; gap: .3rem; }
  .tm-leg button[aria-pressed="false"] { opacity: .4; }
  .tm-leg i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .tm-cvwrap { position: relative; }
  #tm-cv { display: block; width: 100%; height: 300px; touch-action: pan-y; cursor: crosshair; }
  .tm-note { margin: .3rem 0 0; color: var(--muted); font-size: .78rem; }
  .tm-empty { padding: 2.5rem 1rem; text-align: center; color: var(--muted); }
  .tm-info { margin: .15rem 0 .5rem; padding: .5rem .7rem .6rem; background: var(--done-bg); border: 1px solid var(--line); border-radius: 8px; min-height: 5.6rem; }
  .tm-info[hidden] { display: none; }
  .tm-ih { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin-bottom: .3rem; }
  .tm-ih b { font-size: .95rem; }
  .tm-ih small { color: var(--muted); font-size: .75rem; font-weight: 400; margin-left: .35rem; }
  .tm-ih span { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tm-ig { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: .15rem .9rem; }
  .tm-ig div { display: flex; align-items: center; gap: .35rem; font-size: .82rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tm-ig i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tm-ig em { font-style: normal; color: var(--muted); }
  .tm-ig b { margin-left: auto; }

  /* 모바일: 2열 + 카드 압축 */
  @media (max-width: 540px) {
    .wrap { padding: 0 .5rem; }
    .tabs { flex: 1 0 100%; }
    .controls input { flex: 1 1 0; }
    .updated { margin-left: 0; font-size: .75rem; white-space: nowrap; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; padding-top: .5rem; }
    .event-head { padding: .5rem .55rem .4rem; }
    .title-row h2 { font-size: .85rem; }
    .badge { display: none; }
    .zh { font-size: .68rem; }
    .meta { font-size: .7rem; margin-top: .15rem; flex-wrap: wrap; gap: 0 .4rem; }
    .meta strong { font-size: .95rem; }
    .ladder { padding: .3rem .55rem .45rem; }
    .ladder li { grid-template-columns: 3.3rem 1fr 3.7rem; gap: .3rem; padding: .08rem 0; }
    .pct { font-size: .68rem; }
    .bar { height: 6px; }
    .rank { font-size: 1rem; }
    .rank small { font-size: .65rem; }
    .trend-row { padding: 0 .55rem .55rem; }
    .trend { font-size: .75rem; padding: .3rem .3rem; }
    .tm { padding: .5rem; align-items: flex-end; }
    .tm-box { padding: .7rem .7rem .9rem; }
    #tm-cv { height: 260px; }
  }
</style>

<body>
<header class="top">
  <div class="wrap">
    <h1>아스팔트 레전드 순위 컷</h1>
    <p>대회별 상위 % 컷 순위 · 비공식 한국어 페이지</p>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <div class="tabs" role="group" aria-label="대회 상태">
      <button type="button" data-tab="active" aria-pressed="true">진행 중<span class="count num"></span></button>
      <button type="button" data-tab="finished" aria-pressed="false">지난 대회<span class="count num"></span></button>
    </div>
    <input type="search" id="q" placeholder="대회 이름 검색" aria-label="대회 이름 검색">
    <span class="updated" id="updated"></span>
  </div>
  <main id="list" aria-live="polite"></main>
</div>

<div class="tm" id="tm" hidden role="dialog" aria-modal="true" aria-labelledby="tm-title">
  <div class="tm-box">
    <div class="tm-h"><h3 id="tm-title"></h3><button type="button" class="tm-x" id="tm-close">닫기 ✕</button></div>
    <div class="tm-opts">
      <div class="seg" id="tm-range" role="group" aria-label="기간"></div>
      <div class="seg" id="tm-scale" role="group" aria-label="눈금"></div>
    </div>
    <div class="tm-leg" id="tm-leg"></div>
    <div class="tm-info" id="tm-info"></div>
    <div class="tm-cvwrap"><canvas id="tm-cv" aria-label="시간대별 상위 % 컷 순위 꺾은선 그래프"></canvas></div>
    <p class="tm-note" id="tm-note"></p>
  </div>
</div>

<footer>
  <div class="wrap">
    원본: <a href="https://xeyj7va4zfx8.space.minimax.io/" rel="noopener">狂野飙车传奇排行榜 by Galaxy</a>.<br>
    번역은 원문과 다를 수 있습니다.
  </div>
</footer>

<script>
const STEP = 12;
const state = { tab: "active", q: "", events: [], shown: STEP };
const nf = new Intl.NumberFormat("ko-KR");
const collator = new Intl.Collator("ko", { numeric: true, sensitivity: "base" });
const kstFull = iso => new Date(iso).toLocaleString("ko-KR", {
  timeZone: "Asia/Seoul", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false
});
const kstShort = iso => new Date(iso).toLocaleString("ko-KR", {
  timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false
});

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

// total이 null/0이면 가장 큰 구간(상위 N%)의 순위로 역산해서 추정
function getTotal(ev) {
  if (ev.total) return { value: ev.total, estimated: false };
  const tiers = (ev.tiers || []).filter(t => t.pct > 0 && t.rank > 0);
  if (!tiers.length) return null;
  const top = tiers.reduce((a, b) => (b.pct > a.pct ? b : a));
  return { value: Math.round(top.rank * 100 / top.pct), estimated: true };
}

function renderEvent(ev) {
  const card = el("article", "event");
  const head = el("div", "event-head");

  const row = el("div", "title-row");
  const h2 = el("h2", "", ev.name_ko);
  h2.title = ev.name_ko;
  row.append(h2, el("span", "badge " + (ev.status === "active" ? "active" : "finished"),
                    ev.status === "active" ? "진행 중" : "종료"));
  head.append(row);

  const hasZh = ev.name_zh && ev.name_zh !== ev.name_ko;
  const zh = el("p", "zh", hasZh ? ev.name_zh : "\u00a0");
  if (hasZh) zh.title = ev.name_zh;
  head.append(zh);

  const meta = el("p", "meta");
  const tot = getTotal(ev);
  const people = el("span", "", tot && tot.estimated ? "참가자 약 " : "참가자 ");
  people.append(el("strong", "num", tot ? nf.format(tot.value) : "-"), tot ? "명" : "");
  meta.append(people, el("span", "", kstShort(ev.updated_at)));
  head.append(meta);
  card.append(head);

  const ladder = el("ol", "ladder");
  for (const t of ev.tiers) {
    const li = el("li");
    const bar = el("span", "bar");
    const fill = document.createElement("i");
    fill.style.width = Math.min(t.pct, 100) + "%";
    bar.append(fill);
    const rank = el("span", "rank num", nf.format(t.rank));
    rank.append(el("small", "", "위"));
    li.append(el("span", "pct", "상위 " + t.pct + "%"), bar, rank);
    ladder.append(li);
  }
  card.append(ladder);
  const trendRow = el("div", "trend-row");
  const trendBtn = el("button", "trend", "📈 시간대별 그래프");
  trendBtn.type = "button";
  trendBtn.addEventListener("click", () => openTrend(ev, trendBtn));
  trendRow.append(trendBtn);
  card.append(trendRow);
  return card;
}

function render() {
  const q = state.q.trim().toLowerCase();
  const isActive = e => e.status === "active";
  const matches = e => !q || (e.name_ko + " " + e.name_zh).toLowerCase().includes(q);

  document.querySelectorAll(".tabs button").forEach(b => {
    const tab = b.dataset.tab;
    b.setAttribute("aria-pressed", String(tab === state.tab));
    b.querySelector(".count").textContent =
      state.events.filter(e => (tab === "active") === isActive(e)).length;
  });

  const list = document.getElementById("list");
  list.replaceChildren();
  const all = state.events
    .filter(e => (state.tab === "active") === isActive(e))
    .filter(matches)
    .sort(state.tab === "active"
      ? (a, b) => collator.compare(a.name_ko, b.name_ko)
      : (a, b) => new Date(b.updated_at) - new Date(a.updated_at) || b.id - a.id);
  if (!all.length) {
    list.append(el("p", "empty", q ? "검색 결과가 없습니다. 다른 이름으로 찾아보세요." : "표시할 대회가 없습니다."));
    return;
  }

  const limit = state.tab === "active" || q ? all.length : state.shown;
  const grid = el("div", "grid");
  all.slice(0, limit).forEach(e => grid.append(renderEvent(e)));
  list.append(grid);

  if (limit < all.length) {
    const more = el("button", "more", "더 보기 (" + (all.length - limit) + "개 남음)");
    more.type = "button";
    more.addEventListener("click", () => { state.shown = all.length; render(); });
    list.append(more);
  }
}

document.querySelectorAll(".tabs button").forEach(b =>
  b.addEventListener("click", () => { state.tab = b.dataset.tab; state.shown = STEP; render(); }));
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; state.shown = STEP; render(); });

/* ───── 시간대별 변화 그래프 (꺾은선) ───── */
let HIST = null;
function loadHist() {
  if (HIST) return Promise.resolve(HIST);
  return fetch("history.json", { cache: "no-store" })
    .then(r => (r.ok ? r.json() : { events: {} }))
    .catch(() => ({ events: {} }))
    .then(h => (HIST = h));
}
const TREND = { ev: null, rows: [], pcts: [], on: new Set(), range: 0, log: false, opener: null, hi: null };
const PALETTE = ["#d8392b", "#e8870e", "#b79500", "#1d7f49", "#1e88c8", "#6b4fd8", "#9b3a9d", "#555e69"];
const RANGES = [["전체", 0], ["7일", 7 * 864e5], ["3일", 3 * 864e5], ["24시간", 864e5]];
const hhmm = t => new Date(t).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });

function buildRows(ev) {
  const pts = (HIST && HIST.events[String(ev.id)]) || [];
  let pcts = null; const rows = [];
  pts.forEach(p => {
    if (p[3]) pcts = p[3];
    if (!pcts) return;
    const r = {}; pcts.forEach((x, i) => { r[x] = p[2][i]; });
    rows.push({ t: p[0] * 1000, total: p[1], r });
  });
  if (rows.length && ev.status === "active" && state.latest) {         // 진행 중 대회는 마지막 값이 지금까지 이어진 것으로 그림
    const last = rows[rows.length - 1], now = new Date(state.latest).getTime();
    if (now > last.t) rows.push({ t: now, total: last.total, r: last.r, ext: true });
  }
  const set = new Set(); rows.forEach(r => Object.keys(r.r).forEach(k => set.add(+k)));
  return { rows, pcts: [...set].sort((a, b) => a - b) };
}

function openTrend(ev, opener) {
  loadHist().then(() => {
    const b = buildRows(ev);
    Object.assign(TREND, { ev, rows: b.rows, pcts: b.pcts, on: new Set(b.pcts), range: 0, opener, hi: null });
    document.getElementById("tm-title").replaceChildren(ev.name_ko,
      Object.assign(el("small", "", (ev.name_zh && ev.name_zh !== ev.name_ko ? ev.name_zh + " · " : "") + (ev.status === "active" ? "진행 중" : "종료"))));
    renderOpts();
    document.getElementById("tm").hidden = false;
    document.body.style.overflow = "hidden";
    document.getElementById("tm-close").focus();
    drawTrend();
  });
}
function closeTrend() {
  document.getElementById("tm").hidden = true;
  document.body.style.overflow = "";
  if (TREND.opener) TREND.opener.focus();
}
function renderOpts() {
  const rg = document.getElementById("tm-range"), sc = document.getElementById("tm-scale"), lg = document.getElementById("tm-leg");
  rg.replaceChildren(); sc.replaceChildren(); lg.replaceChildren();
  RANGES.forEach(([label, ms]) => {
    const b = el("button", "", label); b.type = "button"; b.setAttribute("aria-pressed", String(TREND.range === ms));
    b.addEventListener("click", () => { TREND.range = ms; TREND.hi = null; renderOpts(); drawTrend(); });
    rg.append(b);
  });
  [["로그 눈금", true], ["선형 눈금", false]].forEach(([label, v]) => {
    const b = el("button", "", label); b.type = "button"; b.setAttribute("aria-pressed", String(TREND.log === v));
    b.addEventListener("click", () => { TREND.log = v; renderOpts(); drawTrend(); });
    sc.append(b);
  });
  TREND.pcts.forEach((p, i) => {
    const b = el("button"); b.type = "button"; b.setAttribute("aria-pressed", String(TREND.on.has(p)));
    const dot = document.createElement("i"); dot.style.background = PALETTE[i % PALETTE.length];
    b.append(dot, "상위 " + p + "%");
    b.addEventListener("click", () => { TREND.on.has(p) ? TREND.on.delete(p) : TREND.on.add(p); if (!TREND.on.size) TREND.on.add(p); renderOpts(); drawTrend(); });
    lg.append(b);
  });
}

function niceTicks(lo, hi, n) {
  const span = hi - lo || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v); return out;
}
function logTicks(lo, hi) {
  const out = []; const a = Math.floor(Math.log10(lo)), b = Math.ceil(Math.log10(hi));
  for (let e = a; e <= b; e++) [1, 2, 5].forEach(m => { const v = m * Math.pow(10, e); if (v >= lo * 0.999 && v <= hi * 1.001) out.push(v); });
  return out;
}
function timeTicks(t0, t1, width) {
  const H = 36e5, D = 24 * H, off = 9 * H, steps = [H, 3 * H, 6 * H, 12 * H, D, 2 * D, 7 * D];
  const want = Math.max(2, Math.floor(width / 60));
  const step = steps.find(s => (t1 - t0) / s <= want) || 7 * D;
  const out = []; for (let t = Math.ceil((t0 + off) / step) * step - off; t <= t1; t += step) out.push(t);
  return { out, step, day: step >= D };
}

function drawTrend() {
  const cv = document.getElementById("tm-cv"), note = document.getElementById("tm-note");
  const wrap = cv.parentNode;
  wrap.querySelectorAll(".tm-empty").forEach(n => n.remove());
  const allRows = TREND.rows;
  if (allRows.length < 2) {
    cv.style.display = "none"; note.textContent = ""; document.getElementById("tm-info").hidden = true;
    wrap.append(el("p", "tm-empty", "아직 시간대별 기록이 부족해서 그래프를 그릴 수 없어요. 데이터가 쌓이면 보여요."));
    return;
  }
  cv.style.display = "block";
  const tEnd = allRows[allRows.length - 1].t;
  const rows = TREND.range ? allRows.filter(r => r.t >= tEnd - TREND.range) : allRows;
  // 기간을 줄였을 때 시작점이 비지 않게 그 직전 값도 포함
  if (TREND.range && rows.length < allRows.length) { const i = allRows.indexOf(rows[0]); if (i > 0) rows.unshift(allRows[i - 1]); }
  const vis = TREND.pcts.filter(p => TREND.on.has(p));
  const W = cv.clientWidth || 600, H = cv.clientHeight || 300, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const L = 56, R = 12, T = 10, B = 26, pw = W - L - R, ph = H - T - B;
  const t0 = Math.max(rows[0].t, TREND.range ? tEnd - TREND.range : rows[0].t), t1 = tEnd;
  let lo = Infinity, hi = -Infinity;
  rows.forEach(r => vis.forEach(p => { const v = r.r[p]; if (v > 0) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  if (!isFinite(lo)) { lo = 1; hi = 10; }
  const logS = TREND.log && lo > 0;
  let ylo, yhi;
  if (logS) { ylo = Math.pow(10, Math.floor(Math.log10(lo) * 4) / 4) * 0.9; yhi = hi * 1.1; if (yhi <= ylo) yhi = ylo * 10; }
  else { ylo = 0; yhi = hi * 1.06; }
  const X = t => L + (t1 === t0 ? 0 : (t - t0) / (t1 - t0) * pw);
  const Y = v => T + (logS ? (Math.log(yhi) - Math.log(Math.max(v, ylo))) / (Math.log(yhi) - Math.log(ylo)) : (yhi - v) / (yhi - ylo)) * ph;
  const css = getComputedStyle(document.documentElement), line = css.getPropertyValue("--line").trim(), muted = css.getPropertyValue("--muted").trim();
  g.font = '12px "Barlow Condensed", "Noto Sans KR", sans-serif'; g.textBaseline = "middle";
  // 세로 눈금(순위)
  (logS ? logTicks(ylo, yhi) : niceTicks(ylo, yhi, 5)).forEach(v => {
    const y = Y(v); g.strokeStyle = line; g.lineWidth = 1; g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke();
    g.fillStyle = muted; g.textAlign = "right"; g.fillText(nf.format(v), L - 6, y);
  });
  // 가로 눈금(시각)
  const tk = timeTicks(t0, t1, pw); g.textAlign = "center"; g.textBaseline = "top";
  tk.out.forEach(t => {
    const x = X(t); g.strokeStyle = line; g.beginPath(); g.moveTo(x, T); g.lineTo(x, T + ph); g.stroke();
    const d = new Date(t + 9 * 36e5), lab = tk.day ? (d.getUTCMonth() + 1) + "/" + d.getUTCDate() : (d.getUTCMonth() + 1) + "/" + d.getUTCDate() + " " + d.getUTCHours() + "시";
    g.fillStyle = muted; g.fillText(lab, Math.min(Math.max(x, L + 16), L + pw - 16), T + ph + 6);
  });
  // 선
  vis.slice().reverse().forEach(p => {
    const color = PALETTE[TREND.pcts.indexOf(p) % PALETTE.length];
    g.strokeStyle = color; g.lineWidth = 2; g.lineJoin = "round"; g.beginPath(); let st = false;
    rows.forEach(r => { const v = r.r[p]; if (!(v > 0)) return; const x = X(r.t), y = Y(v); if (!st) { g.moveTo(x, y); st = true; } else g.lineTo(x, y); });
    g.stroke();
  });
  // 마우스·손가락 위치 표시
  if (TREND.hi != null && rows[TREND.hi]) {
    const r = rows[TREND.hi], x = X(r.t);
    g.strokeStyle = muted; g.setLineDash([4, 3]); g.beginPath(); g.moveTo(x, T); g.lineTo(x, T + ph); g.stroke(); g.setLineDash([]);
    vis.forEach(p => { const v = r.r[p]; if (!(v > 0)) return; g.fillStyle = PALETTE[TREND.pcts.indexOf(p) % PALETTE.length]; g.strokeStyle = "#fff"; g.lineWidth = 1.5; g.beginPath(); g.arc(x, Y(v), 4, 0, 6.2832); g.fill(); g.stroke(); });
  }
  note.textContent = "기록 " + allRows.filter(r => !r.ext).length + "개 · " + hhmm(allRows[0].t) + " ~ " + hhmm(tEnd) + " (한국 시간) · 값이 바뀐 시점마다 기록돼요";
  cv._g = { rows, vis, X, L, pw, T, ph, t0, t1 };
  showInfo(rows, vis);
}

function showInfo(rows, vis) {                 // 그래프 위 정보칸: 짚은 시점(없으면 가장 최근 값)의 순위를 보여 줌 — 그래프를 가리지 않음
  const box = document.getElementById("tm-info"); box.hidden = false;
  const picked = TREND.hi != null && rows[TREND.hi], r = picked || rows[rows.length - 1];
  const head = el("div", "tm-ih"), left = el("b", "", hhmm(r.t));
  left.append(el("small", "", picked ? "선택한 시점" : "가장 최근"));
  head.append(left, el("span", "", r.total ? "참가자 " + nf.format(r.total) + "명" : ""));
  const grid = el("div", "tm-ig");
  vis.forEach(p => {
    if (!(r.r[p] > 0)) return;
    const row = document.createElement("div"), dot = document.createElement("i");
    dot.style.background = PALETTE[TREND.pcts.indexOf(p) % PALETTE.length];
    row.append(dot, el("em", "", "상위 " + p + "%"), el("b", "", nf.format(r.r[p]) + "위")); grid.append(row);
  });
  box.replaceChildren(head, grid);
}
function onPointer(ev) {
  const cv = document.getElementById("tm-cv"), G = cv._g; if (!G) return;
  const rect = cv.getBoundingClientRect(), x = ev.clientX - rect.left;
  let best = 0, bd = Infinity;
  G.rows.forEach((r, i) => { const d = Math.abs(G.X(r.t) - x); if (d < bd) { bd = d; best = i; } });
  if (TREND.hi !== best) { TREND.hi = best; drawTrend(); }
}
(function () {
  const cv = document.getElementById("tm-cv");
  cv.addEventListener("pointermove", onPointer);
  cv.addEventListener("pointerdown", onPointer);
  document.getElementById("tm-close").addEventListener("click", closeTrend);
  document.getElementById("tm").addEventListener("click", e => { if (e.target.id === "tm") closeTrend(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !document.getElementById("tm").hidden) closeTrend(); });
  window.addEventListener("resize", () => { if (!document.getElementById("tm").hidden) drawTrend(); });
})();

fetch("data.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    state.events = data.events;
    state.latest = data.latest_update;
    document.getElementById("updated").textContent = "데이터 기준 " + kstFull(data.latest_update);
    render();
  })
  .catch(() => {
    document.getElementById("list").replaceChildren(
      el("p", "empty", "데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요."));
  });
</script>
